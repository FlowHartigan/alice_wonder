name: CI

on: pull_request

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, Vitest et Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Installer Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérifier TypeScript et compiler le client
        run: npm run build

      - name: Exécuter Vitest
        run: npm test

      - name: Installer Chromium, Firefox et leurs dépendances
        run: npx playwright install --with-deps chromium firefox

      - name: Exécuter les parcours Playwright
        id: playwright
        run: npm run test:e2e

      - name: Publier les diagnostics Playwright
        if: ${{ failure() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
